<title>SKH Prestige Motors — Quality used cars, finance-ready</title>
<style>
/* ============================================================
   SKH Inc — shared brand system
   Light + dark · modern · sleek · editorial
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=Saira+Condensed:ital,wght@1,700;1,800&display=swap');

:root {
  /* Fonts */
  --font-display: 'Schibsted Grotesk', system-ui, sans-serif;
  --font-body:    'Hanken Grotesk', system-ui, sans-serif;
  --font-logo:    'Saira Condensed', sans-serif;

  /* Surfaces — warm paper whites */
  --paper:      #F6F5F1;   /* page base */
  --paper-2:    #FBFAF7;   /* alt sections */
  --ink:        #17181C;   /* near-black — text & primary action */
  --char:       #EFEDE7;   /* deeper warm panel (footer / bands) */
  --char-2:     #F3F1EC;
  --panel:      #FFFFFF;   /* raised card */
  --panel-2:    #FBFAF7;

  /* Metal — for the star / logo marks */
  --gun:        #484E5C;
  --graphite:   #5A6172;
  --steel-lo:   #9AA0A8;
  --steel-hi:   #D8DCE0;

  /* Accents — used sparingly */
  --red:        #C0272D;   /* brand bar / quiet active accent */
  --amber:      #C8941A;   /* logo bar + star glyphs only */
  --cream:      #2A2520;   /* Prestige = warm espresso ink (readable on white) */
  --blush:      #F3E8E3;   /* Prestige tint surface */
  --green:      #0B8F5D;   /* finance accent — bars, stars, large headings */
  --green-deep: #076E48;   /* finance text / buttons — AA on white & with white text */
  --green-tint: #E7F3EC;

  /* Text */
  --tx:         #17181C;
  --tx-soft:    #5C616A;
  --tx-dim:     #90949C;
  --hair:       rgba(23,24,28,0.09);
  --hair-2:     rgba(23,24,28,0.15);

  /* Dark surfaces — anchoring weight */
  --dark:       #14161B;   /* deep cool ink */
  --dark-2:     #1B1E25;   /* raised dark panel */
  --dark-3:     #232730;   /* dark hover / chip */
  --dark-line:  rgba(255,255,255,0.10);
  --on-dark:      #D8DBE1; /* body text on dark */
  --on-dark-soft: #9AA0AB; /* secondary on dark */
  --on-dark-dim:  #6C7280; /* eyebrow/dim on dark */

  --r-sm: 12px;
  --r:    18px;
  --r-lg: 26px;
  --r-xl: 34px;
  --r-pill: 999px;

  --shadow-sm:   0 2px 10px -5px rgba(20,24,40,0.12);
  --shadow:      0 10px 30px -16px rgba(20,24,40,0.16), 0 2px 8px -5px rgba(20,24,40,0.08);
  --shadow-deep: 0 28px 60px -34px rgba(20,24,40,0.30), 0 8px 20px -14px rgba(20,24,40,0.12);
  --maxw: 1200px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--tx);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(1100px 560px at 85% -8%, rgba(72,78,92,0.05), transparent 60%),
    radial-gradient(900px 520px at -8% 4%, rgba(192,39,45,0.03), transparent 55%);
  background-attachment: fixed;
  overflow-x: hidden;
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }

/* ---------- Typography ---------- */
.display, h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.022em;
  line-height: 1.06;
  margin: 0;
  text-transform: none;
  color: var(--ink);
  text-wrap: balance;
}
h1, .display { font-weight: 800; }
.italic { font-style: normal; }   /* legacy hook — no longer italic */
.eyebrow {
  font-family: var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.2em;
  font-weight: 600;
  font-size: 0.72rem;
  color: var(--tx-dim);
}

.wrap { width: min(100% - 40px, var(--maxw)); margin-inline: auto; }

/* ---------- Surfaces ---------- */
.panel {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--hair);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
}
/* legacy sheen hook — intentionally inert in the light system */
.sheen::before { content: none; }

.silver-text {
  background: linear-gradient(165deg, #3C414B 0%, #23262C 60%, #14161A 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  padding-right: 0.06em;
}

/* ---------- Accent bars (mirrors the logo) ---------- */
.bars { display: flex; gap: 5px; align-items: center; }
.bars > i { display: block; height: 3px; border-radius: 2px; }
.bars > i:nth-child(1) { width: 24px; background: var(--red); }
.bars > i:nth-child(2) { width: 16px; background: var(--amber); }
.bars > i:nth-child(3) { width: 11px; background: linear-gradient(90deg, var(--steel-lo), var(--steel-hi)); }

.bar-underline {
  height: 3px; width: 54px; border-radius: 2px;
  background: linear-gradient(90deg, var(--red) 0 40%, var(--amber) 40% 70%, var(--steel-hi) 70% 100%);
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--font-body);
  font-weight: 600; text-transform: none; letter-spacing: 0;
  font-size: 1rem;
  padding: 13px 24px; border-radius: var(--r-pill);
  border: 1px solid transparent; cursor: pointer;
  transition: transform .18s ease, box-shadow .25s ease, background .2s ease, border-color .2s ease, color .2s ease;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }

/* primary — solid ink */
.btn-amber {
  background: var(--ink);
  color: #fff;
  box-shadow: 0 12px 26px -14px rgba(20,22,30,0.6);
}
.btn-amber:hover { transform: translateY(-2px); background: #25272d; box-shadow: 0 18px 34px -14px rgba(20,22,30,0.5); }

/* secondary — outline on white */
.btn-cream {
  background: #fff;
  color: var(--ink);
  border-color: var(--hair-2);
  box-shadow: var(--shadow-sm);
}
.btn-cream:hover { transform: translateY(-2px); border-color: var(--ink); }

/* tertiary — ghost */
.btn-ghost {
  background: transparent;
  border-color: var(--hair-2);
  color: var(--ink);
}
.btn-ghost:hover { border-color: var(--ink); background: rgba(23,24,28,0.04); transform: translateY(-2px); }

/* finance — green */
.btn-green {
  background: var(--green-deep);
  color: #fff;
  box-shadow: 0 12px 26px -14px rgba(7,110,72,0.55);
}
.btn-green:hover { transform: translateY(-2px); filter: brightness(1.04); }

/* ---------- Chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-body);
  font-size: 0.82rem; font-weight: 500;
  padding: 5px 12px; border-radius: var(--r-pill);
  background: rgba(23,24,28,0.04);
  border: 1px solid var(--hair);
  color: var(--tx-soft);
}

/* ---------- Star mark ---------- */
.star-svg { display: block; }

/* ---------- Dark surfaces / on-dark utility ---------- */
.on-dark { color: var(--on-dark); }
.on-dark h1, .on-dark h2, .on-dark h3 { color: #fff; }
.on-dark .eyebrow { color: var(--on-dark-dim); }
.on-dark p { color: var(--on-dark-soft); }
.on-dark .silver-text {
  background: linear-gradient(165deg, #ffffff 0%, #c4c9d1 55%, #9aa0ab 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.on-dark .btn-cream { background: rgba(255,255,255,0.06); color:#fff; border-color: rgba(255,255,255,0.18); box-shadow:none; }
.on-dark .btn-cream:hover { border-color:#fff; background: rgba(255,255,255,0.12); }
.on-dark .btn-ghost { color:#fff; border-color: rgba(255,255,255,0.22); }
.on-dark .btn-ghost:hover { border-color:#fff; background: rgba(255,255,255,0.08); }
.on-dark .chip { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); color: var(--on-dark-soft); }
.on-dark .btn-amber { background: #fff; color: var(--ink); box-shadow: 0 14px 30px -16px rgba(0,0,0,0.6); }
.on-dark .btn-amber:hover { background: #edece8; transform: translateY(-2px); }

/* ---------- Sticky nav ---------- */
.nav {
  position: sticky; top: 0; z-index: 60;
  background: rgba(246,245,241,0.78);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border-bottom: 1px solid transparent;
  transition: background .3s ease, border-color .3s ease, box-shadow .3s ease;
}
.nav.scrolled { background: rgba(251,250,247,0.92); border-bottom-color: var(--hair); box-shadow: 0 10px 30px -24px rgba(20,24,40,0.4); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 18px; height: 74px; }
.nav-links { display: flex; gap: 30px; align-items: center; }
.nav-links a {
  font-family: var(--font-body); font-weight: 500;
  text-transform: none; letter-spacing: 0; font-size: 0.98rem;
  color: var(--tx-soft); position: relative; padding: 6px 2px;
  transition: color .2s ease; white-space: nowrap;
}
.nav-links a::after {
  content:""; position:absolute; left:0; right:100%; bottom:-2px; height:2px; border-radius:2px;
  background: var(--ink); transition: right .25s ease;
}
.nav-links a:hover { color: var(--ink); }
.nav-links a:hover::after { right: 0; }

/* ---------- Logo lockup ---------- */
.logo { display: inline-flex; align-items: center; gap: 12px; }
.logo .word {
  font-family: var(--font-logo); font-weight: 800; font-style: italic;
  letter-spacing: 0.01em; line-height: 0.86; text-transform: uppercase;
}
.logo .word .top { font-size: 1.5rem; display: block; padding-right: 0.42em; overflow: visible; }
.logo .word .sub {
  display: block; font-size: 0.58rem; font-style: normal; font-weight: 600;
  letter-spacing: 0.26em; color: var(--tx-dim); margin-top: 4px; font-family: var(--font-body);
}

/* ---------- Footer (dark anchor) ---------- */
.footer { background: var(--dark); border-top: 1px solid var(--dark-line); margin-top: 110px; color: var(--on-dark); }
.footer-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 44px; padding: 72px 0 44px; }
.footer h4 { font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.76rem; color: var(--on-dark-dim); margin: 0 0 16px; }
.footer a { color: var(--on-dark-soft); font-size: 0.96rem; display: block; padding: 5px 0; transition: color .18s; }
.footer a:hover { color: #fff; }
.footer p { color: var(--on-dark-soft) !important; }
.footer .silver-text { background: linear-gradient(165deg, #ffffff 0%, #c4c9d1 55%, #9aa0ab 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.footer .logo .word .sub { color: var(--on-dark-dim); }
.footer .legal { border-top: 1px solid var(--dark-line); padding: 24px 0 44px; color: var(--on-dark-dim); font-size: 0.82rem; display:flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; }

/* ---------- Section scaffolding ---------- */
.section { padding: 92px 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 42px; flex-wrap: wrap; }
.section-head h2 { font-size: clamp(1.9rem, 4vw, 2.9rem); }

/* fade-up on scroll */
.reveal.js-anim { opacity: 0; transform: translateY(22px); transition: opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); }
.reveal.js-anim.in { opacity: 1; transform: none; }

/* ---------- Responsive ---------- */
@media (max-width: 1024px) {
  .nav-links { display: none; }
}
@media (max-width: 880px) {
  body { font-size: 16px; }
  .footer-grid { grid-template-columns: 1fr 1fr; gap: 32px; }
  .section { padding: 66px 0; }
}
@media (max-width: 560px) {
  .footer-grid { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  .reveal.js-anim { transition: none; opacity: 1; transform: none; }
  html { scroll-behavior: auto; }
}

</style>
<style>

  .nav-phone { font-family: var(--font-body); font-weight:600; font-size:1rem; white-space:nowrap; }

    background:

  .hero-p-grid { position:absolute; inset:0; pointer-events:none; opacity:.6;

/* ---------- featured / stock ---------- */
function Featured({ filters, setFilters, onView }) {
  const filtered = useMemo(() => CARS.filter(c => {
    if (filters.make && c.brand !== filters.make) return false;
    if (filters.body && c.body !== filters.body) return false;
    if (filters.priceMax && c.price > filters.priceMax) return false;
    if (filters.model) {
      const q = filters.model.toLowerCase();
      if (!c.name.toLowerCase().includes(q) && !c.brand.toLowerCase().includes(q)) return false;
    }
    return true;
  }), [filters]);

  const active = filters.make || filters.body || filters.model || (filters.priceMax && filters.priceMax < 999999);

  return (
    <section className="section" id="stock">
      <div className="wrap">
        <div className="section-head reveal">

            <button className="fclear" onClick={() => setFilters({ make: "", model: "", priceMax: 999999, body: "" })}>Clear all</button>

        {filtered.length > 0 ? (

/* ---------- app ---------- */
function App() {
  const [filters, setFilters] = useState({ make: "", model: "", priceMax: 999999, body: "" });
  const [selected, setSelected] = useState(null);

  const counts = useMemo(() => {
    const c = {};
    CARS.forEach(car => { c[car.body] = (c[car.body] || 0) + 1; });
    return c;
  }, []);

  const applyAndScroll = (next) => { setFilters(f => ({ ...f, ...next })); scrollToId("stock"); };

  // reveal-on-scroll (progressive enhancement, with safety fallback)
  useEffect(() => {
    const els = [...document.querySelectorAll(".reveal")];
    els.forEach((el, i) => { el.classList.add("js-anim"); el.style.transitionDelay = (Math.min(i % 4, 3) * 60) + "ms"; });
    const io = new IntersectionObserver((ents) => {
      ents.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.08, rootMargin: "0px 0px -30px 0px" });
    els.forEach(el => io.observe(el));
    const t = setTimeout(() => els.forEach(el => el.classList.add("in")), 1500);
    return () => { io.disconnect(); clearTimeout(t); };
  });

  return (
    <React.Fragment>
      <Nav />
      <Hero onSearch={applyAndScroll} />
      <BodyTiles counts={counts} active={filters.body} onPick={(b) => applyAndScroll({ body: filters.body === b ? "" : b, make: "", model: "", priceMax: 999999 })} />
      <WhyBuy />
      <Stats />
      <Featured filters={filters} setFilters={setFilters} onView={setSelected} />
      <FinanceExample />
      <PartExchange />
      <Reviews />
      <Brands onPick={(b) => applyAndScroll({ make: b, body: "", model: "", priceMax: 999999 })} />
      <CrossLinks />
      {selected && <CarDetail car={selected} onClose={() => setSelected(null)} onFinance={() => scrollToId("finance")} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
